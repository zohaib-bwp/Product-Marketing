{% extends "base.html" %}
{% block title %}{% if product %}Edit Product{% else %}Add Product{% endif %}{% endblock %}
{% block content %}
<div class="card mt-4">
  <div class="card-body">
    <h3>{% if product %}Edit Product{% else %}Add Product{% endif %}</h3>
    <form class="mt-3">
      <div class="mb-3"><label class="form-label">Name</label><input class="form-control" value="{{ product.name if product else '' }}"></div>
      <div class="mb-3"><label class="form-label">Price</label><input class="form-control" value="{{ product.price if product else '' }}"></div>
      <button class="btn btn-primary">Save</button>
    </form>
  </div>
</div>
{% endblock %}
