{% extends "base.html" %}
{% block title %}{{ product.name }}{% endblock %}
{% block content %}
<div class="card mt-4">
  <div class="row g-0">
    <div class="col-md-5">
      <img src="{{ product.image_url or 'https://placehold.co/600x400' }}" class="img-fluid rounded-start" alt="{{ product.name }}" style="height: 100%; object-fit: cover;">
    </div>
    <div class="col-md-7">
      <div class="card-body">
        <h2>{{ product.name }}</h2>
        <p class="text-muted">{{ product.description or 'Product description is not available.' }}</p>
        <h3 class="text-primary">${{ "%.2f"|format(product.price) }}</h3>
        <button class="btn btn-primary">Add to Cart</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
