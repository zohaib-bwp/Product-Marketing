{% extends "base.html" %}

{% block title %}Home - Product Marketing{% endblock %}

{% block content %}
<div class="container mt-4">
    <!-- Hero Section -->
    <div class="bg-white p-5 rounded shadow-sm mb-4">
        <h1 class="display-4">Welcome to Product Marketing</h1>
        <p class="lead">Discover amazing products at great prices!</p>
    </div>

    <!-- Filters -->
    <div class="row mb-4">
        <div class="col-md-8">
            <div class="input-group">
                <input type="text" class="form-control" id="searchInput" placeholder="Search products...">
                <button class="btn btn-primary" onclick="loadProducts()">
                    <i class="bi bi-search"></i> Search
                </button>
            </div>
        </div>
        <div class="col-md-4">
            <select class="form-select" id="categoryFilter" onchange="loadProducts()">
                <option value="">All Categories</option>
            </select>
        </div>
    </div>

    <!-- Products Grid -->
    <div class="row" id="productsContainer">
        <div class="col-12 text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Load categories
    async function loadCategories() {
        try {
            const response = await fetch('/api/categories');
            const data = await response.json();
            
            if (data.success) {
                const select = document.getElementById('categoryFilter');
                data.categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.category_id;
                    option.textContent = cat.category_name;
                    select.appendChild(option);
                });
            }
        } catch (error) {
            console.error('Error loading categories:', error);
        }
    }

    // Load products
    async function loadProducts() {
        const container = document.getElementById('productsContainer');
        container.innerHTML = '<div class="col-12 text-center"><div class="spinner-border text-primary"></div></div>';
        
        const categoryId = document.getElementById('categoryFilter').value;
        const search = document.getElementById('searchInput').value;
        
        let url = '/api/products?';
        if (categoryId) url += `category_id=${categoryId}&`;
        if (search) url += `search=${encodeURIComponent(search)}`;
        
        try {
            const response = await fetch(url);
            const data = await response.json();
            
            if (data.success) {
                if (data.products.length === 0) {
                    container.innerHTML = '<div class="col-12 text-center"><p class="text-muted">No products found</p></div>';
                    return;
                }
                
                container.innerHTML = '';
                data.products.forEach(product => {
                    const col = document.createElement('div');
                    col.className = 'col-md-4 col-lg-3 mb-4';
                    col.innerHTML = `
                        <div class="card h-100">
                            <img src="${product.image_url}" class="card-img-top product-img" alt="${product.name}">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">${product.name}</h5>
                                <p class="card-text text-muted small">${product.category_name || 'Uncategorized'}</p>
                                <p class="card-text flex-grow-1">${product.description ? product.description.substring(0, 60) + '...' : ''}</p>
                                <div class="mt-auto">
                                    <p class="h5 text-primary mb-2">$${parseFloat(product.price).toFixed(2)}</p>
                                    <p class="small text-muted mb-2">Stock: ${product.stock_quantity}</p>
                                    <div class="d-grid gap-2">
                                        <a href="/product/${product.product_id}" class="btn btn-outline-primary btn-sm">View Details</a>
                                        <button onclick="addToCart(${product.product_id})" class="btn btn-primary btn-sm" ${product.stock_quantity === 0 ? 'disabled' : ''}>
                                            <i class="bi bi-cart-plus"></i> Add to Cart
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.appendChild(col);
                });
            }
        } catch (error) {
            container.innerHTML = '<div class="col-12 text-center"><p class="text-danger">Error loading products</p></div>';
        }
    }

    // Add to cart
    async function addToCart(productId) {
        try {
            const response = await fetch('/api/cart/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ product_id: productId, quantity: 1 })
            });
            
            const data = await response.json();
            
            if (data.success) {
                showAlert(data.message, 'success');
                updateCartBadge();
            } else {
                showAlert(data.message, 'danger');
            }
        } catch (error) {
            showAlert('Error adding to cart', 'danger');
        }
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
        loadCategories();
        loadProducts();
    });

    // Search on Enter key
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            loadProducts();
        }
    });
</script>
{% endblock %}
