{% extends "base.html" %}

{% block title %}Shopping Cart - Product Marketing{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4"><i class="bi bi-cart"></i> Shopping Cart</h2>
    
    <div class="row">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body" id="cartItemsContainer">
                    <div class="text-center">
                        <div class="spinner-border text-primary" role="status"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Order Summary</h5>
                    <hr>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal:</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Shipping:</span>
                        <span class="text-success">Free</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-3">
                        <strong>Total:</strong>
                        <strong id="total" class="text-primary">$0.00</strong>
                    </div>
                    <div class="d-grid">
                        <a href="{{ url_for('order.checkout_page') }}" class="btn btn-primary" id="checkoutBtn" disabled>
                            Proceed to Checkout
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let cartData = null;

    async function loadCart() {
        try {
            const response = await fetch('/api/cart');
            const data = await response.json();
            
            if (data.success) {
                cartData = data;
                displayCart(data);
            }
        } catch (error) {
            document.getElementById('cartItemsContainer').innerHTML = 
                '<p class="text-danger">Error loading cart</p>';
        }
    }

    function displayCart(data) {
        const container = document.getElementById('cartItemsContainer');
        
        if (data.cart_items.length === 0) {
            container.innerHTML = `
                <div class="text-center py-5">
                    <i class="bi bi-cart-x" style="font-size: 3rem; color: #ccc;"></i>
                    <p class="mt-3">Your cart is empty</p>
                    <a href="{{ url_for('product.index') }}" class="btn btn-primary">Start Shopping</a>
                </div>
            `;
            document.getElementById('checkoutBtn').disabled = true;
            return;
        }

        container.innerHTML = '';
        data.cart_items.forEach(item => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'row border-bottom pb-3 mb-3';
            itemDiv.innerHTML = `
                <div class="col-md-2">
                    <img src="${item.image_url}" class="img-fluid rounded" alt="${item.name}">
                </div>
                <div class="col-md-4">
                    <h6>${item.name}</h6>
                    <p class="text-muted small">Price: $${parseFloat(item.price).toFixed(2)}</p>
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Quantity</label>
                    <div class="input-group input-group-sm">
                        <button class="btn btn-outline-secondary" onclick="updateQuantity(${item.cart_id}, ${item.quantity - 1})">-</button>
                        <input type="number" class="form-control text-center" value="${item.quantity}" min="1" max="${item.stock_quantity}" onchange="updateQuantity(${item.cart_id}, this.value)" style="max-width: 60px;">
                        <button class="btn btn-outline-secondary" onclick="updateQuantity(${item.cart_id}, ${item.quantity + 1})">+</button>
                    </div>
                </div>
                <div class="col-md-2 text-end">
                    <p class="mb-1"><strong>$${parseFloat(item.subtotal).toFixed(2)}</strong></p>
                </div>
                <div class="col-md-1 text-end">
                    <button class="btn btn-sm btn-danger" onclick="removeItem(${item.cart_id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            `;
            container.appendChild(itemDiv);
        });

        document.getElementById('subtotal').textContent = `$${data.total.toFixed(2)}`;
        document.getElementById('total').textContent = `$${data.total.toFixed(2)}`;
        document.getElementById('checkoutBtn').disabled = false;
    }

    async function updateQuantity(cartId, newQuantity) {
        newQuantity = parseInt(newQuantity);
        if (newQuantity < 1) return;

        try {
            const response = await fetch('/api/cart/update', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ cart_id: cartId, quantity: newQuantity })
            });
            
            const data = await response.json();
            
            if (data.success) {
                loadCart();
                updateCartBadge();
            } else {
                showAlert(data.message, 'danger');
            }
        } catch (error) {
            showAlert('Error updating cart', 'danger');
        }
    }

    async function removeItem(cartId) {
        if (!confirm('Remove this item from cart?')) return;

        try {
            const response = await fetch('/api/cart/remove', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ cart_id: cartId })
            });
            
            const data = await response.json();
            
            if (data.success) {
                showAlert(data.message, 'success');
                loadCart();
                updateCartBadge();
            } else {
                showAlert(data.message, 'danger');
            }
        } catch (error) {
            showAlert('Error removing item', 'danger');
        }
    }

    document.addEventListener('DOMContentLoaded', loadCart);
</script>
{% endblock %}
